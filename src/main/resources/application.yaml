spring:
  application:
    name: tarot-reading

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3311/${TAROT_DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${TAROT_DB_USERNAME}
    password: ${TAROT_DB_PASSWORD}
    hikari:
      pool-name: ApiHikariPool
      maximum-pool-size: 30 #부하테스트하면서 늘릴 예정
      minimum-idle: 10

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      chat:
        # 프로세스별 설정이 없을 때만 쓰이는 기본값.
        model: gpt-6-terra
        reasoning-effort: low
        verbosity: medium

# 프로세스별 모델 설정 (AiModelProperties 로 바인딩)
tarot:
  ai:
    # [1] 질문 분석: 짧은 추출 작업, 지연이 사용자 체감에 바로 닿는다
    question-analyzer:
      model: openai/gpt-6-astra
      reasoning-effort: low
      verbosity: medium
    # [3-1] 카드 상호작용 분석: 판단이 필요한 구조 분석, 대신 저렴한 모델로
    analyst:
      model: openai/gpt-5.6-terra
      reasoning-effort: medium
      verbosity: medium
    # [3-2] 서사 생성: 스트리밍 구간이라 첫 토큰까지의 시간이 중요
    reader:
      model: openai/gpt-6-astra
      reasoning-effort: low
      verbosity: medium

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      hikaricp: true # HikariCP 커넥션 풀 메트릭 활성화