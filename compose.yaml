services:
  mysql:
    image: 'mysql:latest'
    container_name: tarot-db
    ports:
      - '3311:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${TAROT_DB_NAME}
      MYSQL_USER: ${TAROT_DB_USERNAME}
      MYSQL_PASSWORD: ${TAROT_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/user-init.sql:/docker-entrypoint-initdb.d/01-init-user.sql
      - ./db/card-init.sql:/docker-entrypoint-initdb.d/02-init-card.sql
      - ./db/reading-init.sql:/docker-entrypoint-initdb.d/03-init-reading.sql
    command:
      # 한글 깨짐 방지
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  prometheus:
    image: prom/prometheus:latest
    container_name: local-prometheus-tarot
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  mysql_data: